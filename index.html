<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d21"><meta name="description" content="Desvie dos obstáculos e sobreviva o máximo que puder."><title>Desvie! — Arcade</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell"><section class="game-card" aria-label="Jogo Desvie!"><header class="game-header"><div><p class="eyebrow">ARCADE NEON</p><h1>Desvie<span>!</span></h1></div><div class="scoreboard" aria-label="Pontuação"><div><span>PONTOS</span><strong id="score">0</strong></div><div><span>RECORDE</span><strong id="high-score">0</strong></div></div></header>
<div class="game-wrap"><canvas id="game" aria-label="Área do jogo"></canvas><div class="overlay" id="start-screen"><div class="overlay-content"><p class="badge">PRONTO?</p><h2>Não deixe encostar.</h2><p>Use <kbd>←</kbd> <kbd>→</kbd> ou <kbd>A</kbd> <kbd>D</kbd> para escapar.</p><button class="primary-button" id="start-button" type="button">Começar</button></div></div><div class="overlay hidden" id="game-over-screen" aria-live="polite"><div class="overlay-content"><p class="badge danger">FIM DE JOGO</p><h2>Quase lá!</h2><p class="final-score">Sua pontuação <strong id="final-score">0</strong></p><p class="new-record hidden" id="new-record">★ Novo recorde!</p><button class="primary-button" id="restart-button" type="button">Jogar novamente</button></div></div></div>
<div class="mobile-controls" aria-label="Controles do jogo"><button class="control-button" id="left-button" type="button" aria-label="Mover para a esquerda">←</button><p>Desvie dos blocos vermelhos</p><button class="control-button" id="right-button" type="button" aria-label="Mover para a direita">→</button></div></section><p class="hint">Sobreviva. Acelere. Supere seu recorde.</p></main><script src="script.js"></script></body></html>
